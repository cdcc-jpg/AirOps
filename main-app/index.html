<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AirOps — Ontology-powered airsoft tactical operations platform for real-time situational awareness, game management, and chrono compliance.">
  <title>AirOps — Tactical Operations Platform</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b6694' stroke-width='2'><circle cx='12' cy='12' r='8'/><line x1='12' y1='2' x2='12' y2='6'/><line x1='12' y1='18' x2='12' y2='22'/><line x1='2' y1='12' x2='6' y2='12'/><line x1='18' y1='12' x2='22' y2='12'/></svg>">
</head>
<body>
  <!-- ═══ Loading Screen ═══ -->
  <div id="loading-screen">
    <div class="loading-logo">AirOps</div>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
    <div class="loading-text">Initializing...</div>
  </div>

  <!-- ═══ Main App Layout ═══ -->
  <div id="app">

    <!-- ─── Sidebar ─── -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="logo" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8"></circle>
              <circle cx="12" cy="12" r="2.5"></circle>
              <line x1="12" y1="2" x2="12" y2="5"></line>
              <line x1="12" y1="19" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="5" y2="12"></line>
              <line x1="19" y1="12" x2="22" y2="12"></line>
            </svg>
          </div>
          <div>
            <h1>AirOps</h1>
            <div class="subtitle">Tactical Operations</div>
          </div>
        </div>
        <button type="button" class="theme-toggle-btn" id="btn-theme-toggle" title="Toggle Daylight / Nocturne theme" aria-label="Toggle Daylight or Nocturne theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
      </div>

      <nav class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="setup">Setup</div>
        <div class="sidebar-tab" data-tab="signin">Sign-In</div>
        <div class="sidebar-tab" data-tab="gameview">Gameview</div>
        <div class="sidebar-tab" data-tab="queries">Queries</div>
        <div class="sidebar-tab" data-tab="advisor">Advisor</div>
      </nav>

      <div class="sidebar-content">
        <div class="sidebar-panel active" id="panel-setup">
          <!-- Phase 1: Setup parameters and suggestions populated by JS -->
        </div>
        <div class="sidebar-panel" id="panel-signin">
          <!-- Phase 2: Chrono check-in and unassigned global pool populated by JS -->
        </div>
        <div class="sidebar-panel" id="panel-gameview">
          <!-- Phase 3: Active game operations and stats comparison populated by JS -->
        </div>
        <div class="sidebar-panel" id="panel-queries">
          <!-- Static semantic queries populated by JS -->
        </div>
        <div class="sidebar-panel" id="panel-advisor">
          <div class="panel-section">
            <h4 class="panel-heading-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              Replica Selection Advisor
            </h4>
            <p class="panel-desc">
              Ontology-driven replica recommendation engine operationalizing <code>airsoft-replica-selector-app.ttl</code> and W3C SKOS controlled vocabulary concepts.
            </p>
          </div>
        </div>
      </div>
    </aside>

    <!-- ─── Tactical Map ─── -->
    <main id="map-area">
      <canvas id="tactical-map"></canvas>

      <!-- Map info overlay -->
      <div class="map-info">
        <div class="game-phase-badge" id="game-phase-badge">
          <div class="dot"></div>
          <span>Loading...</span>
        </div>
      </div>

      <!-- Map controls -->
      <div class="map-controls">
        <button class="map-btn active" id="btn-players" title="Toggle player markers" aria-label="Toggle player markers">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </button>
        <button class="map-btn active" id="btn-labels" title="Toggle zone labels" aria-label="Toggle zone labels">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
        </button>
        <button class="map-btn" id="btn-heatmap" title="Toggle heatmap" aria-label="Toggle heatmap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="5"></circle>
            <circle cx="12" cy="12" r="1.5"></circle>
          </svg>
        </button>
        <button class="map-btn" id="btn-reset" title="Reset view" aria-label="Reset view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>

      <!-- Score display -->
      <div class="score-display" id="score-display">
        <!-- Populated by JS -->
      </div>

      <!-- Zone tooltip -->
      <div class="zone-tooltip" id="zone-tooltip"></div>
    </main>

    <!-- ─── Live Feed ─── -->
    <section id="live-feed">
      <div class="feed-header">
        <h3>
          <span class="feed-dot"></span>
          Live Operations Feed
        </h3>
        <div class="feed-filters">
          <button class="feed-filter active" data-filter="all">All</button>
          <button class="feed-filter" data-filter="elimination">Kills</button>
          <button class="feed-filter" data-filter="objective_capture">Obj</button>
          <button class="feed-filter" data-filter="violation">Violations</button>
        </div>
      </div>
      <div class="feed-entries" id="feed-entries">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- ─── Replica Selection Advisor View ─── -->
    <section id="replica-advisor-view" class="advisor-view-container" style="display:none;"></section>
  </div>

  <!-- ─── Player Detail Overlay ─── -->
  <div class="player-detail-overlay" id="player-detail-overlay">
    <div class="player-detail" id="player-detail">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- ─── Theme Switcher & App Scripts ─── -->
  <script>
    (function() {
      const root = document.documentElement;
      const saved = localStorage.getItem('airops-priory-theme');
      if (saved === 'light') {
        root.classList.remove('dark');
        root.classList.add('light');
      }
      const btn = document.getElementById('btn-theme-toggle');
      if (btn) {
        btn.addEventListener('click', function() {
          const isLight = root.classList.toggle('light');
          root.classList.toggle('dark', !isLight);
          localStorage.setItem('airops-priory-theme', isLight ? 'light' : 'dark');
          window.dispatchEvent(new Event('resize'));
        });
      }
    })();
  </script>
  <script src="js/replica-advisor.js?v=2.11.1"></script>
  <script type="module" src="js/app.js?v=2.11.1"></script>
</body>
</html>
